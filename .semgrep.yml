# Project Semgrep rules for OmniLog.
# Rules are grouped by the attack surface they cover. ERROR rules block the build
# (see .github/workflows/semgrep.yml). WARNING rules are reported in the SARIF output.

rules:
  # ------------------------------------------------------------ Python: command and code execution
  - id: python-subprocess-shell
    languages: [python]
    message: "Avoid shell=True in subprocess calls when possible; it can enable command injection."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: os.system(...)

  - id: python-eval-exec
    languages: [python]
    message: "eval() and exec() run arbitrary code. Do not use them on any input that can come from a user."
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python-pickle-load
    languages: [python]
    message: "Loading untrusted data with pickle can lead to arbitrary code execution."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)

  - id: python-yaml-unsafe-load
    languages: [python]
    message: "yaml.load() without SafeLoader can construct arbitrary Python objects. Use yaml.safe_load()."
    severity: ERROR
    pattern: yaml.load($DATA)

  # ------------------------------------------------------------ Python: SQL
  - id: python-sql-text-fstring
    languages: [python]
    message: "Building SQL with an f-string allows SQL injection. Use bound parameters with text(\"... :name\")."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: text(f"...")
          - pattern: text(f'...')
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute(f'...', ...)

  # ------------------------------------------------------------ Python: JWT
  - id: python-jwt-decode-no-algorithms
    languages: [python]
    message: "jwt.decode() without algorithms= can accept tokens signed with an unexpected algorithm. Pass algorithms=[\"HS256\"]."
    severity: ERROR
    pattern: jwt.decode($TOKEN, $KEY)

  - id: python-jwt-verify-signature-disabled
    languages: [python]
    message: "Disabling signature verification lets anyone forge tokens."
    severity: ERROR
    pattern-regex: 'verify_signature["'']\s*:\s*False'

  # ------------------------------------------------------------ Python: secrets and crypto
  - id: python-hardcoded-secret-key
    languages: [python]
    message: "SECRET_KEY must come from the environment, not from a string literal in code."
    severity: ERROR
    pattern-regex: '^\s*SECRET_KEY\s*=\s*["''][^"'']+["'']'

  - id: python-weak-hash
    languages: [python]
    message: "MD5 and SHA-1 are not safe for passwords or integrity checks. Use bcrypt through the security module."
    severity: WARNING
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: python-insecure-random
    languages: [python]
    message: "The random module is not cryptographically secure. Use secrets for tokens and codes."
    severity: WARNING
    pattern-either:
      - pattern: random.choice(...)
      - pattern: random.randint(...)
      - pattern: random.random(...)
      - pattern: random.getrandbits(...)

  - id: python-requests-verify-false
    languages: [python]
    message: "Disabling TLS verification can expose traffic to interception and tampering."
    severity: ERROR
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)

  # ------------------------------------------------------------ Python: web configuration
  - id: python-fastapi-debug-enabled
    languages: [python]
    message: "debug=True exposes internal details in error responses. Keep it off outside local development."
    severity: ERROR
    pattern: FastAPI(..., debug=True, ...)

  - id: python-cors-wildcard-origin
    languages: [python]
    message: "allow_origins=[\"*\"] lets any website call the API. Use the explicit CORS_ORIGINS list from settings."
    severity: ERROR
    pattern-regex: 'allow_origins\s*=\s*\[\s*["'']\*["'']\s*\]'

  # ------------------------------------------------------------ Python: logging
  - id: python-log-sensitive-value
    languages: [python]
    message: "Logging a password, token or secret leaks it into log files."
    severity: ERROR
    pattern-regex: 'log(ger)?\.(debug|info|warning|error|exception|critical)\(.*(password|secret|token)'

  # ------------------------------------------------------------ TypeScript and React
  - id: javascript-eval
    languages: [javascript, typescript]
    message: "Avoid eval() because it can execute arbitrary code."
    severity: ERROR
    pattern: eval(...)

  - id: javascript-new-function
    languages: [javascript, typescript]
    message: "new Function() runs a string as code, like eval()."
    severity: ERROR
    pattern: new Function(...)

  - id: javascript-dangerously-set-inner-html
    languages: [javascript, typescript]
    message: "Using dangerouslySetInnerHTML can introduce XSS risks."
    severity: WARNING
    pattern-regex: 'dangerouslySetInnerHTML\s*=\s*\{'

  - id: javascript-inner-html-assignment
    languages: [javascript, typescript]
    message: "Assigning innerHTML can introduce XSS. Set textContent or render with React."
    severity: WARNING
    pattern: $EL.innerHTML = $VALUE

  - id: javascript-token-in-local-storage
    languages: [javascript, typescript]
    message: "Storing an auth token in localStorage makes it readable by any injected script. See decision D1 in frontend-issues.md."
    severity: WARNING
    pattern-either:
      - pattern: localStorage.setItem(..., $TOKEN, ...)
      - pattern: sessionStorage.setItem(..., $TOKEN, ...)

  - id: nextjs-public-env-secret
    languages: [javascript, typescript]
    message: "NEXT_PUBLIC_ variables are sent to the browser. Do not put secrets in them."
    severity: ERROR
    pattern-regex: 'NEXT_PUBLIC_\w*(SECRET|PASSWORD|PRIVATE|API_KEY)'

  - id: react-target-blank-without-noopener
    languages: [javascript, typescript]
    message: "target=\"_blank\" without rel=\"noopener noreferrer\" lets the new page access window.opener."
    severity: WARNING
    pattern-regex: '<a[^>]*target=["'']_blank["''](?![^>]*noopener)[^>]*>'

paths:
  exclude:
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
