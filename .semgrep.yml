rules:
  - id: python-subprocess-shell
    languages: [python]
    message: "Avoid shell=True in subprocess calls when possible; it can enable command injection."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: os.system(...)

  - id: python-requests-verify-false
    languages: [python]
    message: "Disabling TLS verification can expose traffic to interception and tampering."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: requests.put(..., verify=False, ...)
          - pattern: requests.delete(..., verify=False, ...)
          - pattern: requests.patch(..., verify=False, ...)
          - pattern: requests.request(..., verify=False, ...)

  - id: python-pickle-load
    languages: [python]
    message: "Loading untrusted data with pickle can lead to arbitrary code execution."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)

  - id: javascript-eval
    languages: [javascript, typescript]
    message: "Avoid eval() because it can execute arbitrary code."
    severity: WARNING
    pattern: eval(...)

  - id: javascript-dangerously-set-inner-html
    languages: [javascript, typescript]
    message: "Using dangerouslySetInnerHTML can introduce XSS risks."
    severity: WARNING
    patterns:
      - pattern: dangerouslySetInnerHTML={...}

paths:
  exclude:
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"