# SonarQube / SonarCloud analysis of OmniLog (#299). The job "SonarQube" in .github/workflows/ci.yml
# runs the scan. The project key and the organization come from the repository variables
# SONAR_PROJECT_KEY and SONAR_ORGANIZATION, and the token from the secret SONAR_TOKEN.
sonar.sources=backend/app,frontend/src
sonar.tests=tests,frontend/tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/.next/**,backend/migrations/**,**/__pycache__/**
sonar.coverage.exclusions=backend/migrations/**,tests/**,frontend/tests/**
sonar.python.coverage.reportPaths=coverage.xml
