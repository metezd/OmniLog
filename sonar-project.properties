# SonarQube / SonarCloud analysis of OmniLog (see docs/tests/quality/README.md for the steps).
sonar.projectKey=OmniLog
sonar.projectName=OmniLog
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.sources=backend/app,frontend/src
sonar.tests=tests,frontend/tests
sonar.test.inclusions=tests/**/*.py,frontend/tests/**/*.ts,frontend/tests/**/*.tsx
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/.venv/**,backend/migrations/**,backend/app/seed/*.json,frontend/public/**

# Coverage reports. Create them first:
#   python -m pytest tests --cov=backend/app --cov-report=xml            -> coverage.xml
#   cd frontend && npx vitest run --coverage --coverage.reporter=lcov     -> frontend/coverage/lcov.info
#   (the frontend run needs the package @vitest/coverage-v8, which is not in package.json yet)
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
