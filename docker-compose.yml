version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnilog_postgres
    environment:
      POSTGRES_DB: omnilog_db
      POSTGRES_USER: omnilog
      POSTGRES_PASSWORD: omnilog_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnilog_network

  redis:
    image: redis:7-alpine
    container_name: omnilog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnilog_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  omnilog_network:
    driver: bridge
