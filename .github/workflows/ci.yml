name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Python static security analysis: Ruff's "S" rules (flake8-bandit). The rule selection and the
  # per-file ignores live in ruff.toml. Runs on every pull request, without a database or services.
  security-lint:
    name: Security lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tests run on the Python version of the production image, so the version that we ship is
      # the version that we test. The version is read from the FROM line of backend/Dockerfile, so a
      # Dependabot update of the base image is tested on the new version in its own pull request.
      - name: Read the Python version of the production image
        id: python
        run: |
          version="$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-.*/\1/p' backend/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error file=backend/Dockerfile::No 'FROM python:<version>-...' line found"
            exit 1
          fi
          echo "Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      # The version is pinned in .github/requirements-ruff.txt, which Dependabot keeps up to date
      - name: Install Ruff
        run: python -m pip install -r .github/requirements-ruff.txt

      - name: Ruff security rules (S / Bandit)
        run: ruff check backend

      # backend/requirements.txt and tests/requirements-test.txt are lock files made from the .in
      # files. This makes them again with the commands written in the .in files, for the Python
      # version of the image, and fails when the result is not the committed file. It finds a
      # change of a .in file without a new lock, a lock that was changed by hand, and a lock that
      # was made for another Python version (after an update of the base image).
      # The version of uv is pinned in .github/requirements-uv.txt, which Dependabot keeps up to date.
      - name: Install uv
        run: python -m pip install -r .github/requirements-uv.txt

      - name: Check that the lock files match the .in files
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.version }}
        run: |
          common=(--generate-hashes --python-platform x86_64-manylinux_2_28 --python-version "$PYTHON_VERSION" --quiet)
          (cd backend && uv pip compile requirements.in -o requirements.txt "${common[@]}")
          uv pip compile tests/requirements-test.in -o tests/requirements-test.txt "${common[@]}"
          if ! git diff --exit-code -- backend/requirements.txt tests/requirements-test.txt; then
            echo "::error::A lock file does not match its .in file. Make it again with the command in backend/requirements.in or tests/requirements-test.in and commit it."
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://omnilog:omnilog@localhost:5432/omnilog_test
      TEST_DATABASE_URL: postgresql+psycopg2://omnilog:omnilog@localhost:5432/omnilog_test
      # Throwaway key used only in CI
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnilog
          POSTGRES_PASSWORD: omnilog
          POSTGRES_DB: omnilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnilog -d omnilog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tests run on the Python version of the production image, so the version that we ship is
      # the version that we test. The version is read from the FROM line of backend/Dockerfile, so a
      # Dependabot update of the base image is tested on the new version in its own pull request.
      - name: Read the Python version of the production image
        id: python
        run: |
          version="$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-.*/\1/p' backend/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error file=backend/Dockerfile::No 'FROM python:<version>-...' line found"
            exit 1
          fi
          echo "Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      # Only the locked versions, and only files with the hashes of the lock files
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes \
            -r backend/requirements.txt \
            -r tests/requirements-test.txt

      # The lock file holds every package with its exact version, so pip-audit checks it as it is,
      # without resolving or installing anything
      - name: Audit backend dependencies
        run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt

      - name: Check database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      # The gate is about 5 points under the measured value, so coverage cannot fall without
      # notice (#297). Change it together with CONTRIBUTING.md and docs/tests/coverage.md.
      - name: Run backend tests
        run: |
          python -m pytest tests -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=90

      - name: Write backend coverage to the job summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python -c "import xml.etree.ElementTree as E; r=float(E.parse('coverage.xml').getroot().get('line-rate')); print(f'### Backend coverage: {r*100:.2f}% of lines (gate 90%)')" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Real IGDB and TMDB calls. Only on a manual run, so normal runs never use the keys.
      # The `secrets` context cannot be used in an `if`, so a first step looks at the secrets and
      # writes a yes or no. It prints the names of missing secrets, never their values.
      # TMDB_API holds the long "API Read Access Token" (it starts with eyJ).
      - name: Check live API secrets (manual run only)
        id: live_keys
        if: github.event_name == 'workflow_dispatch'
        env:
          IGDB_ID: ${{ secrets.IGDB_ID }}
          IGDB_API_KEY: ${{ secrets.IGDB_API_KEY }}
          TMDB_API: ${{ secrets.TMDB_API }}
        run: |
          missing=""
          [ -n "$IGDB_ID" ] || missing="$missing IGDB_ID"
          [ -n "$IGDB_API_KEY" ] || missing="$missing IGDB_API_KEY"
          [ -n "$TMDB_API" ] || missing="$missing TMDB_API"
          if [ -n "$missing" ]; then
            echo "::notice title=Live API tests skipped::Missing repository secrets:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live API tests (manual run only)
        if: github.event_name == 'workflow_dispatch' && steps.live_keys.outputs.available == 'true'
        env:
          RUN_LIVE_API_TESTS: "1"
          IGDB_CLIENT_ID: ${{ secrets.IGDB_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API }}
        # --cov-append adds the live paths to the coverage of the normal run, so the summary
        # shows how much the live tests add (#297)
        run: |
          status=0
          python -m pytest tests/requirements/test_epic3_catalog_live.py -v --cov=backend/app --cov-append --cov-report=xml || status=$?
          python -c "import xml.etree.ElementTree as E; r=float(E.parse('coverage.xml').getroot().get('line-rate')); print(f'### Backend coverage with the live tests: {r*100:.2f}% of lines')" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # SonarQube analysis on SonarCloud with the coverage of the backend job (#299). Skipped while the
  # secret SONAR_TOKEN is not set (also for Dependabot), and for pull requests from forks, which
  # get no secrets. The project key and the organization are repository variables.
  sonarqube:
    name: SonarQube
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check the SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=SonarQube::The secret SONAR_TOKEN is not set, so the scan is skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # The full history lets SonarQube find new code and the authors of the lines
      - name: Checkout
        if: steps.sonar.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download backend coverage
        if: steps.sonar.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage

      - name: Download frontend coverage
        if: steps.sonar.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Vitest writes the paths relative to frontend/, SonarQube reads them from the repository root
      - name: Point the frontend coverage at the repository root
        if: steps.sonar.outputs.available == 'true'
        run: |
          if [ -f frontend/coverage/lcov.info ]; then
            sed 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info > frontend/coverage/lcov-root.info
          fi

      # Fails the job when the quality gate fails
      - name: SonarQube scan
        if: steps.sonar.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://omnilog:omnilog@localhost:5432/omnilog
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the Compose file
        run: docker compose config --quiet

      # --wait blocks until the healthchecks of both services pass
      - name: Start services
        run: docker compose up -d --wait --wait-timeout 120

      - name: Check PostgreSQL
        run: |
          docker compose exec -T db psql -U omnilog -d omnilog -c "SELECT 1"
          docker compose exec -T db psql -U omnilog -d omnilog_test -c "SELECT 1"
          docker compose exec -T db psql -U omnilog -d omnilog -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Check Redis
        run: docker compose exec -T redis redis-cli ping | grep PONG

      # The tests run on the Python version of the production image, so the version that we ship is
      # the version that we test. The version is read from the FROM line of backend/Dockerfile, so a
      # Dependabot update of the base image is tested on the new version in its own pull request.
      - name: Read the Python version of the production image
        id: python
        run: |
          version="$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-.*/\1/p' backend/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error file=backend/Dockerfile::No 'FROM python:<version>-...' line found"
            exit 1
          fi
          echo "Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt

      - name: Run migrations on the Compose database
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on a known high or critical problem in a package that runs in production. The
      # development tools are left out on purpose: vitest has open advisories that need a major
      # upgrade, which is planned as separate work.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The thresholds are in vitest.config.mts (#297)
      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Write frontend coverage to the job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total; console.log(`### Frontend coverage: ${t.lines.pct}% of lines, ${t.statements.pct}% of statements, ${t.functions.pct}% of functions, ${t.branches.pct}% of branches`)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build