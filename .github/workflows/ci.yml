name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://omnilog:omnilog@localhost:5432/omnilog_test
      TEST_DATABASE_URL: postgresql+psycopg2://omnilog:omnilog@localhost:5432/omnilog_test
      # Throwaway key used only in CI
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnilog
          POSTGRES_PASSWORD: omnilog
          POSTGRES_DB: omnilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnilog -d omnilog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r backend/requirements.txt \
            -r tests/requirements-test.txt

      - name: Check database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        run: |
          python -m pytest tests/requirements -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Build
        run: npm run build