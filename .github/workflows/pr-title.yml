name: Pull request names

on:
  pull_request:
    # labeled and unlabeled run the AI disclosure check again when ai-assisted is added or removed
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # The title becomes the commit subject after "Rebase and merge" of a one-commit pull request,
  # so it must be a Conventional Commit (see "Commit messages" in CONTRIBUTING.md).
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The title is user input, so it reaches the script only through an environment variable
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|chore|ci|refactor|perf|build|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "The title is a Conventional Commit."
          else
            # The title is printed on its own line, never inside a workflow command
            printf 'Title: %s\n' "$TITLE"
            echo "::error title=Pull request title::The title is not a Conventional Commit. Use 'type(scope): text', for example 'docs: explain the release steps'. Types: feat, fix, docs, test, chore, ci, refactor, perf, build, revert."
            exit 1
          fi

  # Second line of defense for the "Branch names" ruleset (.github/rulesets/branch-names.json).
  # Dependabot branches are allowed, as in the ruleset.
  branch:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|test)/[a-z0-9][a-z0-9._-]*$'
          if [[ "$BRANCH" =~ $pattern || "$BRANCH" == dependabot/* ]]; then
            echo "The branch name follows type/short-description."
          else
            printf 'Branch: %s\n' "$BRANCH"
            echo "::error title=Branch name::The branch name does not follow type/short-description. Allowed types: feat, fix, chore, docs, test, in lower case with hyphens, for example 'feat/my-work'."
            exit 1
          fi

  # The section "AI assistance" of the pull request template (CONTRIBUTING.md, "AI assistance", #309).
  # Exactly one box must be ticked, and the label ai-assisted must be set when AI helped.
  # Dependabot pull requests have no template, so they are skipped.
  ai-disclosure:
    name: AI disclosure
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The description is user input, so it reaches the script only through an environment
      # variable, and the script never prints it
      - name: Check the AI assistance section
        env:
          BODY: ${{ github.event.pull_request.body }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ai-assisted') }}
        run: |
          section="$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk '/^## AI assistance[[:space:]]*$/ { found = 1; next } /^## / { found = 0 } found')"
          if [ -z "$section" ]; then
            echo "::error title=AI disclosure::The description has no section '## AI assistance'. Copy it from .github/pull_request_template.md."
            exit 1
          fi
          ticked="$(printf '%s\n' "$section" | grep -E '^- \[[xX]\] (None|AI helped|AI wrote most of it)[[:space:]]*$' || true)"
          count="$(printf '%s' "$ticked" | grep -c . || true)"
          if [ "$count" != "1" ]; then
            echo "::error title=AI disclosure::Tick one box in '## AI assistance': None, AI helped or AI wrote most of it ($count ticked)."
            exit 1
          fi
          if ! printf '%s' "$ticked" | grep -q 'None' && [ "$HAS_LABEL" != "true" ]; then
            echo "::error title=AI disclosure::AI helped with this change, so add the label ai-assisted."
            exit 1
          fi
          echo "The AI assistance section is filled in."
