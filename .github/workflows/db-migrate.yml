name: Database Migration (Supabase)

# Runs the Alembic migrations of main against the Supabase database.
#
# The migrations run inside the production image of the backend (backend/Dockerfile), so they use
# the same Python, the same locked packages and the same alembic.ini as the API. Before, the job
# ran `alembic upgrade head` in the root of the repository, where there is no alembic.ini, and it
# failed with "No 'script_location' key found in configuration" on every push. A failed run of this
# workflow is a failed check of the commit, so Render did not deploy omnilog-api any more.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two runs must never migrate the same database at the same time
concurrency:
  group: db-migrate-supabase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: supabase-production
      url: https://supabase.com/dashboard/project/wziszajksrinkubgswof/editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the backend image
        run: docker build --tag omnilog-backend-migrate backend

      # The API settings need a SECRET_KEY at import. The migrations sign no token, so a random key
      # is made for this run only.
      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          export SECRET_KEY
          docker run --rm --env DATABASE_URL --env SECRET_KEY omnilog-backend-migrate alembic upgrade head
