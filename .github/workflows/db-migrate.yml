name: Database Migration (Supabase)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'alembic/**'
      - 'alembic.ini'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: supabase-production
      url: https://supabase.com/dashboard/project/wziszajksrinkubgswof/editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4062e16d28028 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: alembic upgrade head