name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, so secrets that were committed and later removed are found too
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The open-source CLI is used directly. gitleaks-action needs a license key for
      # organization repositories, the binary does not. The version and the SHA-256 are
      # pinned so a new release or a changed download cannot alter results without a PR.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      # --redact keeps the secret values out of the public job log
      - name: Scan for leaked secrets
        run: gitleaks detect --source . --verbose --redact

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Dependency vulnerabilities (requirements.txt, package-lock.json) and
      # misconfigurations in the Dockerfiles and Compose files
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      # Pinned so that a new release cannot change results without a PR
      - name: Install zizmor
        run: python -m pip install zizmor==1.32.0

      # Audits the workflows and dependabot.yml: unpinned actions, script injection, excessive
      # permissions, spoofable bot checks. --strict-collection fails when a file cannot be parsed,
      # because zizmor would otherwise skip that file with only a warning.
      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --no-progress .github
