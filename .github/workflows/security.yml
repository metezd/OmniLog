name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, so secrets that were committed and later removed are found too
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The open-source CLI is used directly. gitleaks-action needs a license key for
      # organization repositories, the binary does not. The version and the SHA-256 are
      # pinned so a new release or a changed download cannot alter results without a PR.
      # Dependabot cannot update a downloaded binary: to upgrade, change both values below.
      # The SHA-256 of linux_x64 is in gitleaks_<version>_checksums.txt of the release page.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      # --redact keeps the secret values out of the public job log
      - name: Scan for leaked secrets
        run: gitleaks detect --source . --verbose --redact

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Dependency vulnerabilities (requirements.txt, package-lock.json) and
      # misconfigurations in the Dockerfiles and Compose files
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # The version is pinned in .github/requirements-zizmor.txt, which Dependabot keeps up to date
      - name: Install zizmor
        run: python -m pip install -r .github/requirements-zizmor.txt

      # Audits the workflows and dependabot.yml: unpinned actions, script injection, excessive
      # permissions, spoofable bot checks. --strict-collection fails when a file cannot be parsed,
      # because zizmor would otherwise skip that file with only a warning.
      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --no-progress .github

  # Report only. The community rules are downloaded at run time and change over time, so they must
  # not decide whether a pull request can be merged. A finding, or a pack that cannot be
  # downloaded, shows up as a warning on the run. The rules that block live in ruff.toml,
  # eslint.config.mjs and tests/test_security_static.py.
  semgrep-registry:
    name: semgrep-registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # The version is pinned in .github/requirements-semgrep.txt, which Dependabot keeps up to date
      - name: Install Semgrep
        run: python -m pip install -r .github/requirements-semgrep.txt

      # One scan per pack, so that a wrong pack name does not stop the others. Secrets (Gitleaks)
      # and GitHub Actions (zizmor) have their own jobs, so their packs are not used here.
      - name: Scan with the community rules
        env:
          PACKS: "p/python p/typescript p/react p/nextjs p/jwt p/docker p/owasp-top-ten"
          SEMGREP_SEND_METRICS: "off"
        run: |
          for pack in ${PACKS}; do
            out="semgrep-${pack//\//-}.json"
            echo "::group::Semgrep ${pack}"
            if semgrep scan --config "${pack}" --metrics=off --disable-version-check --text --json-output "${out}" --sarif-output "${out%.json}.sarif" .; then
              count=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['results']))" "${out}")
              if [ "${count}" != "0" ]; then
                echo "::warning title=Semgrep ${pack}::${count} finding(s), see the log of this step"
              fi
            else
              echo "::warning title=Semgrep ${pack}::the scan failed (unknown pack, or the registry could not be reached)"
            fi
            echo "::endgroup::"
          done

      # The full report of every pack (all severities) as SARIF, to open in an editor or a viewer
      - name: Upload the SARIF reports as artifact
        if: always() && hashFiles('semgrep-*.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-results
          path: semgrep-*.sarif
          if-no-files-found: error
