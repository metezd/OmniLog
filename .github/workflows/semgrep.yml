name: Semgrep

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # No usage data is sent to Semgrep's servers
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          # Pinned so that a new release cannot change results without a PR
          python -m pip install semgrep==1.181.0

      - name: Full scan and SARIF report (all severities)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --metrics=off \
            --sarif \
            --output semgrep.sarif

      - name: Upload SARIF report as artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: error

      - name: Gate on ERROR findings
        # --error makes Semgrep exit with 1 when it finds something at this severity
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --metrics=off \
            --severity ERROR \
            --error

      - name: Registry rules (advisory, does not block)
        # Community rule packs from the Semgrep registry. Reported in the log only,
        # because their findings have not been reviewed for this codebase yet.
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/github-actions \
            --metrics=off \
            --severity ERROR \
            --error
