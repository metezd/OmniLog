name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    # Requirement tests are written to FAIL until the features are implemented.
    # Set repository variable ENFORCE_BACKEND_TESTS=true (Settings > Variables)
    # once the implementation starts, and this job becomes blocking.
    continue-on-error: ${{ vars.ENFORCE_BACKEND_TESTS != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements-test.txt

      - name: Run tests with coverage
        # Run from repo root: conftest.py adds backend/ to sys.path.
        # Threshold is 70% per NFR-05 in requirements-specification.md.
        run: >
          pytest tests/requirements -v
          --cov=backend/app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
