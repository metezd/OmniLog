databases:
  - name: omnilog-db
    databaseName: omnilog
    user: omnilog
    region: frankfurt
    plan: free

services:
  - type: keyvalue
    name: omnilog-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: omnilog-api
    runtime: python
    region: frankfurt
    rootDir: backend
    plan: free
    # Deploy main only after its GitHub checks pass (see docs/deployment.md, section 5)
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.0
      - key: DATABASE_URL
        fromDatabase:
          name: omnilog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: omnilog-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # The API documentation is not public in production
      - key: ENABLE_DOCS
        value: "false"
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: omnilog-web
    runtime: node
    region: frankfurt
    rootDir: frontend
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 26
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false