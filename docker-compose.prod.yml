# Production stack: PostgreSQL (pgvector), Redis, backend, frontend and a reverse proxy.
# Start:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Settings: copy env.prod.example to .env.prod and fill it in. See docs/deployment.md.
name: omnilog

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-omnilog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@db:5432/${POSTGRES_DB:-omnilog}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.prod}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.prod}
  # The API documentation is not public in production
  ENABLE_DOCS: ${ENABLE_DOCS:-false}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-90}
  # Caches. The defaults are the same as in backend/app/core/config.py.
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
  DETAILS_CACHE_TTL_SECONDS: ${DETAILS_CACHE_TTL_SECONDS:-86400}
  NEGATIVE_CACHE_TTL_SECONDS: ${NEGATIVE_CACHE_TTL_SECONDS:-300}
  DB_CACHE_TTL_DAYS: ${DB_CACHE_TTL_DAYS:-7}
  # Calls to IGDB and TMDB
  EXTERNAL_API_TIMEOUT_SECONDS: ${EXTERNAL_API_TIMEOUT_SECONDS:-8}
  EXTERNAL_API_MAX_RETRIES: ${EXTERNAL_API_MAX_RETRIES:-3}
  EXTERNAL_API_BACKOFF_SECONDS: ${EXTERNAL_API_BACKOFF_SECONDS:-0.5}
  IGDB_MAX_REQUESTS_PER_SECOND: ${IGDB_MAX_REQUESTS_PER_SECOND:-3}
  # Not needed here: FORWARDED_ALLOW_IPS (below) already gives the browser address. It only takes
  # effect when the frontend gets the same key, which this file does not do. See docs/deployment.md.
  FRONTEND_PROXY_SECRET: ${FRONTEND_PROXY_SECRET:-}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  SPOILER_MODEL: ${SPOILER_MODEL:-gpt-4o-mini}
  SPOILER_THRESHOLD: ${SPOILER_THRESHOLD:-0.5}
  SPOILER_PROVIDER: ${SPOILER_PROVIDER:-openai}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-8}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  OPENAI_COOLDOWN_SECONDS: ${OPENAI_COOLDOWN_SECONDS:-60}
  BACKGROUND_WORKERS: ${BACKGROUND_WORKERS:-2}
  # Rate limits (#217). "<count>/<second|minute|hour|day>". See docs/deployment.md.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/minute}
  RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-20/hour}
  RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5/hour}
  RATE_LIMIT_REGISTER_DAY: ${RATE_LIMIT_REGISTER_DAY:-20/day}
  RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-30/minute}
  RATE_LIMIT_REVIEW: ${RATE_LIMIT_REVIEW:-20/minute}
  RATE_LIMIT_DETAILS: ${RATE_LIMIT_DETAILS:-60/minute}
  RATE_LIMIT_RECOMMENDATIONS: ${RATE_LIMIT_RECOMMENDATIONS:-30/minute}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnilog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-omnilog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The password comes from the environment, so it does not show in the process list
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Runs once: brings the database to the latest migration, then stops
  migrate:
    build: ./backend
    image: omnilog-backend:${TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    build: ./backend
    image: omnilog-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Only the proxy and the frontend may tell the backend the address of the browser
      # (X-Forwarded-For). The rate limits count that address. Their fixed addresses are below.
      FORWARDED_ALLOW_IPS: 172.30.42.10,172.30.42.11
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        # Written into the JavaScript at build time. It is the address that the browser calls.
        NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL in .env.prod}
    image: omnilog-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      # The server code of the frontend calls the backend at this address, inside the private
      # network. The browser never calls the backend itself.
      BACKEND_URL: http://backend:8000
    networks:
      internal:
        # Fixed, because the backend trusts the X-Forwarded-For header of this address
        ipv4_address: 172.30.42.11

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.prod}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      internal:
        # Fixed, because the backend trusts the X-Forwarded-For header of this address
        ipv4_address: 172.30.42.10

# One private network. Only the proxy publishes ports, so the database, Redis, the backend and
# the frontend cannot be reached from outside the host.
#
# The proxy and the frontend have fixed addresses (see FORWARDED_ALLOW_IPS of the backend). The
# other services get an address from the upper half of the subnet, so they never take one of them.
networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.42.0/24
          ip_range: 172.30.42.128/25

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
